name: 刷新趋势快照并部署 Pages

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取 trending 并生成静态站点
        run: node build-static.mjs

      - name: 提交快照回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982825+github-actions[bot]@users.noreply.github.com"
          git add docs/data || true
          git diff --staged --quiet || git commit -m "chore: 更新趋势快照"
          git push || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
